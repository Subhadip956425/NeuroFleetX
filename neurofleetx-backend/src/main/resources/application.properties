spring.application.name=${SPRING_APPLICATION_NAME}

# -----------------------------
# DATABASE CONFIG
# -----------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}

# -----------------------------
# MACHINE LEARNING SERVICE
# -----------------------------
ml.service.url=${ML_SERVICE_URL}
ml.service.connect-timeout=${ML_SERVICE_CONNECT_TIMEOUT}
ml.service.read-timeout=${ML_SERVICE_READ_TIMEOUT}

# -----------------------------
# SMTP EMAIL
# -----------------------------
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED}

# -----------------------------
# APPLICATION SETTINGS
# -----------------------------
app.name=${APP_NAME}
app.url=${APP_URL}
app.support.email=${APP_SUPPORT_EMAIL}
app.noreply.email=${APP_NOREPLY_EMAIL}

# -----------------------------
# PASSWORD RESET
# -----------------------------
password.reset.token.expiry=${PASSWORD_RESET_TOKEN_EXPIRY}

# -----------------------------
# BOOKING CONFIG
# -----------------------------
booking.default-price-per-hour=${BOOKING_DEFAULT_PRICE_PER_HOUR}
booking.ev-surcharge=${BOOKING_EV_SURCHARGE}
booking.time-slot-duration-minutes=${BOOKING_TIME_SLOT_DURATION}

# -----------------------------
# RAZORPAY
# -----------------------------
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# -----------------------------
# MAINTENANCE CONFIG
# -----------------------------
maintenance.check-interval-days=${MAINTENANCE_CHECK_INTERVAL_DAYS}
maintenance.critical-threshold=${MAINTENANCE_CRITICAL_THRESHOLD}
maintenance.due-threshold=${MAINTENANCE_DUE_THRESHOLD}

# Logging
logging.level.com.infosys.service=INFO
logging.level.com.infosys.controller=INFO
logging.level.com.infosys.repository=DEBUG
